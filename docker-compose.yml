services:
  postgres:
    image: postgres:16-alpine
    container_name: hui-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monster_game}
      POSTGRES_USER: ${POSTGRES_USER:-monster_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monster_game_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monster_game} -d ${POSTGRES_DB:-monster_game}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hui-backend
    environment:
      FLASK_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://monster_game:monster_game_password@postgres:5432/monster_game}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REGISTRATION_IP_LIMIT: ${REGISTRATION_IP_LIMIT:-3}
      REGISTRATION_IP_WINDOW_SECONDS: ${REGISTRATION_IP_WINDOW_SECONDS:-86400}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-1048576}
      MAX_USERNAME_LENGTH: ${MAX_USERNAME_LENGTH:-32}
      MAX_PASSWORD_LENGTH: ${MAX_PASSWORD_LENGTH:-128}
      MAX_INSULT_LENGTH: ${MAX_INSULT_LENGTH:-1000}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    volumes:
      - ./backend:/app
      - ./model:/app/model:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: flask --app run.py run --host=0.0.0.0 --port=5000

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: hui-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5001/api}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host=0.0.0.0 --port=5173

volumes:
  postgres_data:
  frontend_node_modules:
